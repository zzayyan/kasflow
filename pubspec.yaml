name: cashflow_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  powersync: 2.6.0
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # App type from the Cashflow UI/UX design (lib/theme.dart). Static instances of the Google Fonts variable font (OFL, see assets/fonts).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
