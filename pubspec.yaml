name: cashflow_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  intl: ^0.20.3
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  powersync: 2.6.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dashboard/ # shapes and icons from the Financy design (Figma)
  # Financy type, used on Beranda. Static instances of the Google Fonts variable fonts, Latin subset (OFL, see assets/fonts).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
    # App type from the Cashflow UI/UX design (lib/theme.dart). Static instances of the Google Fonts variable font (OFL, see assets/fonts).
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
